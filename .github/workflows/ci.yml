name: Journal Club PPT validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install public test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Test workflow contracts and PDF source preparation
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test portable deck and navigation logic
        # Real PPTX export/render/finalization tests require the Codex host runtime.
        # Keep their explicit skips visible; never substitute a mock renderer.
        run: |
          env -u RUNTIME_NODE_MODULES -u RUNTIME_PYTHON \
            -u BUILDER_TEST_WORKDIR -u BUILDER_PRESENTATIONS_SKILL \
            node --test tests/test_build_deck.mjs tests/test_navigation.mjs

      - name: Explain validation scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Public CI runs Python workflow/source-preparation tests (including real PDFium PDF rendering and cropping) and portable Node deck/navigation tests.

          Three Node integration tests are explicitly skipped because they require the Codex artifact-tool runtime and, for finalization, the installed Presentations skill. This workflow does not validate PPTX export, PPTX rendering, fonts, or human/agent visual review. Run those integrations in the supported Codex host before claiming that a generated deck is ready for delivery.
          EOF

  required-validation:
    # Branch protection requires this exact final check name.
    name: validate
    if: always()
    needs: portable-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require portable validation to succeed
        run: test "${{ needs.portable-tests.result }}" = "success"
